apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-route
spec:
  parentRefs:
  - name: app-web
  rules:
  - backendRefs:
    - name: frontend-svc
      port: 80
    pathMatch:
      type: PathPrefix
      value: /first

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-route-2
spec:
  parentRefs:
  - name: app-web
  rules:
  - backendRefs:
    - name: frontend-svc-2
      port: 80
    pathMatch:
      type: PathPrefix
      value: /second
